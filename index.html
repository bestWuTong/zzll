<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="政治理论判断题排坑速练 · 章节练习 / 打乱刷题 / 错题集">
<title>政治理论排坑速练</title>
<!-- 网页图标：favicon-32.png 体积小、缩放干净，优先给现代浏览器；
     favicon.ico 为多尺寸（16/32/48）兜底，覆盖老浏览器与书签、任务栏 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  /* 主题：显式选择优先，否则跟随系统。
     必须放在这里同步执行——在首帧绘制前把 data-theme 打上去，避免先闪一下亮色。 */
  (function () {
    var theme;
    try {
      var saved = localStorage.getItem('zzll.theme.v1');
      if (saved === 'dark' || saved === 'light') theme = saved;
    } catch (e) { /* 隐私模式读不到 localStorage，退回系统偏好 */ }
    if (!theme) {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    /* 同步浏览器地址栏配色（此处的色值与 css 里的 --bg 保持一致） */
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#242428' : '#f5f5f7');
  })();
</script>
</head>
<body>

<div class="app">

  <!-- ==================== 首页 ==================== -->
  <main id="view-home" class="view is-active">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-heading">
          <h1 class="hero-title">政治理论排坑速练</h1>
          <p class="hero-sub">判断题专项 · 把易错点练成肌肉记忆</p>
        </div>

        <!-- 右侧工具区：题库切换 + 暗色模式切换 -->
        <div class="hero-tools" id="heroTools">
          <div class="bank-switch" id="bankSwitch">
            <span class="bank-switch-hint" id="bankSwitchHint">切换题库：</span>
            <button class="bank-btn" id="bankBtn" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-label="切换题库">
              <span class="bank-btn-label" id="bankBtnLabel">超格</span>
              <svg class="bank-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </button>
          </div>

          <button class="theme-btn" id="themeBtn" type="button" aria-label="切换到暗色模式" title="切换到暗色模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
          </button>

          <!-- 下拉菜单挂在工具区上（而不是切换器上）：
               这样不管工具区里再放几个按钮，菜单右边缘始终贴内容区右边，
               向左展开也不会越出屏幕。 -->
          <div class="bank-menu" id="bankMenu" role="listbox" aria-label="选择题库" hidden></div>
        </div>
      </div>

      <div class="hero-stats" id="homeStats"></div>
    </header>

    <div class="quick-grid">
      <button class="quick-card quick-wrong" id="btnGoWrong" type="button">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5 20 7v5.2c0 4.4-3.2 7.4-8 8.3-4.8-.9-8-3.9-8-8.3V7l8-3.5Z"></path>
            <path d="M9.2 12.2l2 2 3.6-3.9"></path>
          </svg>
        </span>
        <span class="quick-title">错题集</span>
        <span class="quick-desc" id="wrongCountText">— 题</span>
      </button>

      <button class="quick-card quick-shuffle" id="btnShuffle" type="button">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 4h4v4"></path>
            <path d="M21 4l-6.5 6.5"></path>
            <path d="M17 20h4v-4"></path>
            <path d="M21 20l-6.5-6.5"></path>
            <path d="M3 20h3.5l10-16H20"></path>
          </svg>
        </span>
        <span class="quick-title">打乱刷题</span>
        <span class="quick-desc">随机抽题练习</span>
      </button>
    </div>

    <h2 class="section-title">章节题库</h2>
    <div class="chapter-list" id="chapterList"></div>

    <p class="foot" id="footMeta"></p>
  </main>

  <!-- ==================== 错题集 ==================== -->
  <main id="view-wrong" class="view">
    <header class="topbar">
      <button class="icon-btn" id="wrongBack" type="button" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div class="topbar-mid">
        <div class="topbar-title">错题集</div>
        <div class="topbar-sub" id="wrongSub">共 0 题</div>
      </div>
      <button class="topbar-btn" id="btnWrongStart" type="button">开始刷题</button>
    </header>

    <div class="tool-row">
      <button class="chip-btn" id="btnWrongExport" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M8 11l4 4 4-4"></path><path d="M5 19h14"></path></svg>
        导出 JSON
      </button>
      <button class="chip-btn" id="btnWrongImport" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"></path><path d="M8 13l4-4 4 4"></path><path d="M5 5h14"></path></svg>
        导入 JSON
      </button>
      <button class="chip-btn chip-danger" id="btnWrongClear" type="button">清空</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>

    <div class="wrong-list" id="wrongList"></div>
  </main>

  <!-- ==================== 刷题 ==================== -->
  <main id="view-quiz" class="view">
    <header class="topbar">
      <button class="icon-btn" id="quizBack" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div class="topbar-mid">
        <div class="topbar-title" id="quizTitle">练习</div>
        <div class="topbar-sub" id="quizCounter">1 / 1</div>
      </div>
      <div class="topbar-right" id="quizScore"></div>
    </header>

    <div class="progress"><div class="progress-bar" id="quizProgress"></div></div>

    <div class="quiz-body">
      <div class="q-card">
        <div class="q-tag" id="qTag"></div>
        <p class="q-stem" id="qStem"></p>
      </div>

      <div class="options" id="qOptions">
        <button class="opt" data-choice="正确" type="button">
          <span class="opt-dot"></span><span class="opt-label">正确</span>
        </button>
        <button class="opt" data-choice="错误" type="button">
          <span class="opt-dot"></span><span class="opt-label">错误</span>
        </button>
      </div>

      <div class="feedback" id="qFeedback" hidden></div>

      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btnPrev" type="button">上一题</button>
        <button class="btn btn-primary" id="btnNext" type="button">下一题</button>
      </div>
    </div>
  </main>

  <!-- ==================== 结果 ==================== -->
  <main id="view-result" class="view">
    <div class="result-wrap">
      <div class="result-ring">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" cx="60" cy="60" r="52" id="ringFg"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-rate" id="resultRate">0%</div>
          <div class="ring-label">正确率</div>
        </div>
      </div>

      <p class="result-count" id="resultCount">正确 0 题 / 共 0 题</p>
      <p class="result-hint" id="resultHint"></p>

      <div class="result-actions" id="resultActions"></div>

      <div class="result-review" id="resultReview"></div>
    </div>
  </main>

</div>

<!-- ==================== 弹窗：打乱刷题题量 ==================== -->
<div class="modal" id="shuffleModal" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="选择题目数量">
    <div class="modal-head">
      <h3>打乱刷题</h3>
      <p id="modalSub">从全部题目中随机抽取</p>
    </div>

    <label class="modal-check">
      <input type="checkbox" id="optPriority" checked>
      <span class="mc-box" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      </span>
      <span class="mc-text">优先推送答对次数最少的题目</span>
    </label>

    <p class="modal-note">选择每一组的题目数量</p>
    <div class="modal-options">
      <button class="modal-opt" data-count="5" type="button"><span>5 题</span><em>快速热身</em></button>
      <button class="modal-opt" data-count="10" type="button"><span>10 题</span><em>一组常规练习</em></button>
      <button class="modal-opt" data-count="20" type="button"><span>20 题</span><em>一组强化练习</em></button>
    </div>
    <button class="modal-cancel" data-close="1" type="button">取消</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data/chaoge.js"></script>
<script src="data/xiaohei.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
