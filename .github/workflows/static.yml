# 静态站点部署到 GitHub Pages
# 站点地址：https://www.bestwutong.top/zzll/
name: Deploy static content to Pages

# ── 触发时机 ────────────────────────────────────────────────────────────
# 1) push 到 main 分支：任何代码提交/合并推送上来就自动部署
# 2) workflow_dispatch：在仓库 Actions 页面手动点 "Run workflow" 启动
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# ── 并发控制 ────────────────────────────────────────────────────────────
# group 固定为 "pages"，同一仓库的所有部署共用这一把锁，同时只跑一个。
# cancel-in-progress: true —— 新的部署一开始，立刻取消仍在进行中的旧部署，
# 避免旧的（内容已经过时的）部署后完成、把新内容覆盖掉。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库就是站点根目录（index.html 在仓库根）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
